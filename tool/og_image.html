<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Serai share image (1200×630)</title>
<!-- Rendered by tool/og_image.py; served from the repo root so /assets/... resolves. -->
<link rel="stylesheet" href="/assets/fonts/nunito.css">
<style>
:root{--ground:#F1E3C6;--surface:#FBF3E2;--raised:#F6EAD0;--line:#DAC8A6;--ink:#0A2A3D;--muted:#554A37;--accent:#814301;--kicker:#912B18;
  --band-a:#814301;--band-b:#1F5B7C;--band-c:#2D6B45;--band-d:#B93F27;--tile:#FBF3E2;--tile-border:#D4D3C8;--on-band:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;background:var(--ground);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
/* Landscape strip along the bottom, fading up into the parchment. */
.land{position:absolute;left:0;right:0;bottom:0;height:226px;background:url(/assets/landscape-2000.webp) 50% 100%/1200px auto no-repeat;
  -webkit-mask:linear-gradient(to bottom,transparent 0,#000 46%);mask:linear-gradient(to bottom,transparent 0,#000 46%)}
.copy{position:absolute;left:64px;top:74px;width:730px}
.brand{display:flex;align-items:center;gap:26px}
.brand img{width:112px;height:112px;border-radius:25px;box-shadow:0 0 0 1.5px var(--line),0 6px 18px rgba(61,51,36,.18)}
.brand h1{font-weight:900;font-size:108px;line-height:1;letter-spacing:-1px;margin-top:-6px}
.tagline{margin-top:26px;font-weight:900;font-size:40px;line-height:1.15;color:var(--accent)}
.lines{margin-top:16px;font-weight:700;font-size:28px;line-height:1.45;color:var(--muted)}
.lines .dot{color:var(--kicker);font-weight:900;padding:0 .12em}
.board{position:absolute;right:64px;top:56px;width:318px;height:318px;padding:9px;border-radius:26px;background:var(--raised);
  box-shadow:0 0 0 1.5px var(--line),0 10px 28px rgba(61,51,36,.16)}
.board svg{display:block;width:300px;height:300px}
.grain{position:absolute;inset:0;pointer-events:none;background:#3D3324;opacity:.22;
  -webkit-mask:url(/assets/paper-grain.png) 0 0/128px 128px repeat;mask:url(/assets/paper-grain.png) 0 0/128px 128px repeat}
</style>
</head>
<body>
<div class="land"></div>
<div class="copy">
  <div class="brand"><img src="/assets/camel-1024.jpg" alt=""><h1>Serai</h1></div>
  <p class="tagline">Find your words on the Silk Road</p>
  <p class="lines">Vocabulary word-search game for iPhone<br>15 languages<span class="dot"> · </span>about 8,000 words<span class="dot"> · </span>A1 to C2</p>
</div>
<div class="board"><svg id="board" viewBox="0 0 282 282" aria-hidden="true"></svg></div>
<div class="grain"></div>
<script>
// Same cell layout as the hero board in index.html: 66 px tiles, 6 px gaps, centres at 33 + 72·i.
const rows = ['SPOO', 'ERBN', 'ADCU', 'AETP'];
const words = [ // [colour, cells as [row, col]]
  ['var(--band-a)', [[0,0],[0,1],[0,2],[0,3],[1,3]]],   // SPOON
  ['var(--band-b)', [[1,2],[1,1],[1,0],[2,0],[2,1]]],   // BREAD
  ['var(--band-c)', [[2,2],[2,3],[3,3]]],               // CUP
];
const c = i => 33 + 72 * i, ns = 'http://www.w3.org/2000/svg', svg = document.getElementById('board');
const el = (tag, attrs, style) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (style) e.setAttribute('style', style); svg.appendChild(e); return e; };
for (let r = 0; r < 4; r++) for (let q = 0; q < 4; q++)
  el('rect', {x: 72 * q, y: 72 * r, width: 66, height: 66, rx: 12, 'stroke-width': 1.5}, 'fill:var(--tile);stroke:var(--tile-border)');
const onBand = new Set();
for (const [colour, cells] of words) {
  const d = cells.map(([r, q], i) => (i ? 'L' : 'M') + c(q) + ',' + c(r)).join(' ');
  for (const [w, op] of [[62, .25], [48, 1]])
    el('path', {d, fill: 'none', 'stroke-width': w, 'stroke-opacity': op, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, 'stroke:' + colour);
  cells.forEach(([r, q]) => onBand.add(r * 4 + q));
}
rows.forEach((row, r) => [...row].forEach((ch, q) => {
  el('text', {x: c(q), y: c(r) + 10, 'text-anchor': 'middle', 'font-family': 'Nunito, sans-serif', 'font-weight': 900, 'font-size': 29},
     'fill:' + (onBand.has(r * 4 + q) ? 'var(--on-band)' : 'var(--ink)')).textContent = ch;
}));
</script>
</body>
</html>
