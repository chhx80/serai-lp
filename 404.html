:root,:root[data-theme="dark"]{--ground:#0F1022;--surface:#181A33;--tile:#181A33;--line:#323663;--tile-border:#3A3F72;
--ink:#EEEFFF;--muted:#A9ACD6;--accent:#8B93FF;--on-accent:#0F1022;--on-ink:#0F1022;--link:#B9BEFF;
--kicker:#F2A55C;--blue:#8B93FF;--green:#4FD08E;--orange:#F2A55C;--pink:#F28BB6;--on-band:#0F1022;
--feature:#1E2142;--feature-border:#4A4F8E;--phone:#06071A;--glow:rgba(139,147,255,.25);--glow-strong:rgba(139,147,255,.3);color-scheme:dark}
:root[data-theme="light"]{--ground:#EFF0FB;--surface:#FFFFFF;--tile:#FFFFFF;--line:#C9CCEA;--tile-border:#C9CCEA;
--ink:#1B1D45;--muted:#4C507A;--accent:#4338CA;--on-accent:#FFFFFF;--on-ink:#FFFFFF;--link:#4338CA;

--feature:#FFFFFF;--feature-border:#B4AFEA;--phone:#1B1D45;--glow:rgba(67,56,202,.16);--glow-strong:rgba(67,56,202,.22);color-scheme:light}
.theme-switch{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.theme-switch button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.theme-switch button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.theme-switch button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme-switch svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html{background:var(--ground)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ground);color:var(--ink);font-family:Geologica,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
